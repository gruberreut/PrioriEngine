# Builds the apps/web Storybook and publishes it to GitHub Pages
# (https://gruberreut.github.io/PrioriEngine/). See TASKS-TECH.md § 57.
name: Publish Storybook

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "package-lock.json"
      - ".github/workflows/storybook-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push cancels a queued (not running) one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STORYBOOK_DISABLE_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build-storybook -w @priori/web
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
