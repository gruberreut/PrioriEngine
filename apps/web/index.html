<!doctype html>
<html lang="en">
  <head>
    <script>
      // Keep in sync with timeOfDayTheme() in src/features/theme/useTheme.ts -
      // this can't import that module, so the day/night split is duplicated
      // here to resolve 'auto' before first paint instead of flashing the
      // CSS media-query fallback (system preference) then correcting to the
      // JS-computed time-of-day value once React mounts.
      var t = localStorage.getItem('tendril-theme');
      if (t !== 'light' && t !== 'dark') {
        var hour = new Date().getHours();
        t = (hour >= 6 && hour < 18) ? 'light' : 'dark';
      }
      document.documentElement.dataset.theme = t;
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F3EEE6" />
    <title>web</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
